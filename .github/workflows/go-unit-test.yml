name: Go Unit Tests
on: 
  push:
    branches: [main]
    paths:
      - 'go/**.go'
      - 'go/**.mod'
      - 'go/**.sum'
      - '.github/workflows/go-unit-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'go/**.go'
      - 'go/**.mod'
      - 'go/**.sum'
      - '.github/workflows/go-unit-test.yml'
  workflow_dispatch:
    
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with: 
          go-version-file: go/go.mod
      
      - name: Install gotestsum for report
        run: go install gotest.tools/gotestsum@latest

      - name: Build Go
        working-directory: ./go
        run: go build ./...
      
      - name: Test Go
        working-directory: ./go
        run: gotestsum --format testname --junitfile go-output.xml -- ./...
      
      - name: Upload JUnit file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-result
          path: ./go/go-output.xml
  comment-pr:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    if: ${{always() && github.event_name == 'pull_request'}}
    needs: unit-test
    steps:
      - name: Github Script
        uses: actions/github-script@v7
        with:
          script: |
            let result;
            if ('${{ needs.unit-test.result }}' === 'success') {
              result = '✅'
            } else if ('${{ needs.unit-test.result }}' === 'failure') {
              result = '❌';
            } else {
              result = '❓';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${result} ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/run/${context.runId}`
            });
  test-reporter:
    if: always()
    permissions:
      checks: write
      contents: read
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Download Artifact go
        uses: actions/download-artifact@v4
        with:
          name: go-result
      
      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: Résultats Unit Tests GO
          path: '**/go-output.xml'
          reporter: java-junit
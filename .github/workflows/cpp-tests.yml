name: Run Unit Tests
permissions:
  checks: write
  contents: read
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - 'CMakeLists.txt'

jobs:
  cpp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Configure CMake
        working-directory: ./cpp
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (includes GTest via FetchContent)
        working-directory: ./cpp
        run: cmake --build build --target UnitTests --config Release -j$(nproc)

      - name: Run tests
        working-directory: ./cpp
        run: ctest --test-dir build --output-on-failure --output-junit results.xml

      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        if: always()
        with:
          name: Résultats Unit Tests
          path: '**/results.xml'
          reporter: java-junit